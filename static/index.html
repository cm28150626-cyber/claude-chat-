<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude 助理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #13110e; color: #e8dcc8; height: 100vh; display: flex; flex-direction: column; }
#header { padding: 14px 16px; background: #1e1a14; border-bottom: 1px solid #2d2820; font-size: 16px; color: #e8c87a; letter-spacing: 2px; text-align: center; }
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.user { background: #8b6914; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.claude { background: #1e1a14; color: #e8dcc8; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2d2820; }
.msg.thinking { color: #7a6a58; font-style: italic; }
#input-area { padding: 12px 16px; background: #1e1a14; border-top: 1px solid #2d2820; display: flex; gap: 10px; align-items: flex-end; }
#input { flex: 1; background: #13110e; border: 1px solid #2d2820; color: #e8dcc8; border-radius: 20px; padding: 10px 16px; font-size: 15px; font-family: inherit; resize: none; max-height: 120px; outline: none; line-height: 1.5; }
#input:focus { border-color: #8b6914; }
#send { background: #8b6914; border: none; color: #fff; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 18px; flex-shrink: 0; transition: background .15s; }
#send:hover { background: #a07820; }
#send:disabled { background: #3d3020; cursor: default; }
</style>
</head>
<body>
<div id="header">Claude 助理</div>
<div id="messages">
  <div class="msg claude">哈囉！有什麼想法或問題，隨時告訴我 😊</div>
</div>
<div id="input-area">
  <textarea id="input" placeholder="輸入訊息..." rows="1"></textarea>
  <button id="send" onclick="sendMsg()">➤</button>
</div>
<script>
var history = [];

var input = document.getElementById('input');
input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

function addMsg(role, text) {
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
  return div;
}

async function sendMsg() {
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send').disabled = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });

  var thinking = addMsg('claude thinking', '思考中...');

  try {
    var controller = new AbortController();
    var timeout = setTimeout(function(){ controller.abort(); }, 90000);
    var res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
      signal: controller.signal
    });
    clearTimeout(timeout);
    var data = await res.json();
    thinking.remove();
    if (data.reply) {
      addMsg('claude', data.reply);
      history.push({ role: 'assistant', content: data.reply });
    } else {
      addMsg('claude', '發生錯誤：' + data.error);
    }
  } catch (e) {
    thinking.remove();
    if (e.name === 'AbortError') {
      addMsg('claude', '回應太慢，請再試一次（伺服器剛啟動需要等待）');
    } else {
      addMsg('claude', '連線失敗：' + e.message);
    }
  }
  document.getElementById('send').disabled = false;
  input.focus();
}
</script>
</body>
</html>
