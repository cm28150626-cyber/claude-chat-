<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Claude 助理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, sans-serif; background: #13110e; color: #e8dcc8; display: flex; flex-direction: column; height: 100dvh; }
#header { padding: 14px 16px; background: #1e1a14; border-bottom: 1px solid #2d2820; font-size: 17px; color: #e8c87a; letter-spacing: 2px; text-align: center; flex-shrink: 0; }
#messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.user { background: #8b6914; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.claude { background: #1e1a14; color: #e8dcc8; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2d2820; }
.msg.thinking { color: #7a6a58; font-style: italic; background: #1e1a14; border: 1px solid #2d2820; align-self: flex-start; border-bottom-left-radius: 4px; }
#input-area { padding: 10px 12px; background: #1e1a14; border-top: 1px solid #2d2820; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
#input { flex: 1; background: #2a2520; border: 1.5px solid #3d3020; color: #e8dcc8; border-radius: 22px; padding: 11px 16px; font-size: 16px; font-family: inherit; resize: none; max-height: 120px; outline: none; line-height: 1.5; -webkit-appearance: none; }
#input:focus { border-color: #8b6914; }
#send { background: #8b6914; border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
#send:active { background: #a07820; transform: scale(0.95); }
#send:disabled { background: #3d3020; }
</style>
</head>
<body>
<div id="header">Claude 助理</div>
<div id="messages" id="messages">
  <div class="msg claude">哈囉！有什麼想法或問題，隨時告訴我 😊</div>
</div>
<div id="input-area">
  <textarea id="input" placeholder="輸入訊息..." rows="1"></textarea>
  <button id="send">➤</button>
</div>
<script>
var history = [];
var msgBox = document.getElementById('messages');
var input = document.getElementById('input');
var sendBtn = document.getElementById('send');

input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

sendBtn.addEventListener('click', function() { sendMsg(); });

function addMsg(role, text) {
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  msgBox.appendChild(div);
  msgBox.scrollTop = msgBox.scrollHeight;
  return div;
}

async function sendMsg() {
  var text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  var thinking = addMsg('thinking', '思考中...');

  try {
    var controller = new AbortController();
    var timeout = setTimeout(function(){ controller.abort(); }, 90000);
    var res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
      signal: controller.signal
    });
    clearTimeout(timeout);
    var data = await res.json();
    thinking.remove();
    if (data.reply) {
      addMsg('claude', data.reply);
      history.push({ role: 'assistant', content: data.reply });
    } else {
      addMsg('claude', '錯誤：' + (data.error || '未知'));
    }
  } catch (e) {
    thinking.remove();
    if (e.name === 'AbortError') {
      addMsg('claude', '伺服器剛啟動，請再傳一次訊息');
    } else {
      addMsg('claude', '連線失敗，請重新整理頁面');
    }
  }
  sendBtn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
